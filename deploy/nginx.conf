# /etc/nginx/sites-available/wedding
# Замени wedding.example.ru на свой домен

server {
    listen 80;
    server_name wedding.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wedding.example.ru;

    # SSL — certbot обновит эти пути автоматически
    ssl_certificate /etc/letsencrypt/live/wedding.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wedding.example.ru/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static files — Next.js standalone не раздаёт static сам
    location /_next/static/ {
        alias /var/www/wedding/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Public files (images, fonts)
    location /guests/ {
        alias /var/www/wedding/public/guests/;
        expires 30d;
        access_log off;
    }

    # Next.js app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
